<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login - VOW</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body style="background:#f8fafc">
<div class="container" style="max-width:380px;padding-top:70px">
<div style="text-align:center;margin-bottom:22px"><div class="brand">VOW</div><div style="color:var(--muted);font-size:12px;margin-top:4px">ADMIN AUTHORITY ACCESS ONLY</div></div>
<div class="card">
<h2 style="font-size:16px;font-weight:700;margin-bottom:14px">Admin Login</h2>
{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for cat,msg in messages %}<div class="flash flash-{{cat}}">{{msg}}</div>{% endfor %}{% endif %}{% endwith %}
<form method="POST">
<div style="margin-bottom:12px"><span class="label">Username</span><input class="input" name="username" required value="sachin"></div>
<div style="margin-bottom:16px"><span class="label">Password</span><input class="input" type="password" name="password" required placeholder="••••••••"></div>
<button class="btn" style="width:100%;justify-content:center">Secure Login</button>
</form>
<div style="margin-top:14px;padding:10px;background:#f8fafc;border-radius:8px;font-size:11px;color:var(--muted)"></div>
</div>
<a href="/" style="display:block;text-align:center;margin-top:16px;font-size:13px;color:var(--muted);text-decoration:none">← Back to Home</a>
</div>
</body></html>
