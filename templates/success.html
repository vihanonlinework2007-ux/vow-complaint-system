<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Success - VOW</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
<div class="container" style="max-width:460px;padding-top:80px;text-align:center">
<div class="card" style="padding:28px">
<div style="width:48px;height:48px;background:#0f172a;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:22px">✓</div>
<h2 style="font-size:20px;font-weight:800">Complaint Submitted</h2>
<p style="color:var(--muted);font-size:13px;margin-top:8px">Your permanent Complaint ID</p>
<div style="background:#0f172a;color:#fff;padding:14px;border-radius:10px;font-weight:800;letter-spacing:1.2px;font-size:20px;margin:14px 0">{{complaint.complaint_id}}</div>
<p style="font-size:12.5px;color:var(--muted)">Name: {{complaint.name}}<br>Phone: {{complaint.phone}}<br>Service: {{complaint.service}}<br><br>Team will contact you soon. Save this ID for tracking.</p>
<div style="display:flex;gap:10px;margin-top:20px"><a href="/" class="btn" style="flex:1;justify-content:center">Submit Another</a><a href="/" class="btn btn-light" style="flex:1;justify-content:center">Home</a></div>
</div>
</div>
</body></html>
